name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: maestro
          POSTGRES_DB: maestro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maestro" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://maestro:maestro@localhost:5432/maestro
      DATABASE_URL: postgres://maestro_app:maestro_app@localhost:5432/maestro
      TEST_DATABASE_ADMIN_URL: postgres://maestro:maestro@localhost:5432/maestro_test
      TEST_DATABASE_URL: postgres://maestro_app:maestro_app@localhost:5432/maestro_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create roles and test database
        run: psql postgres://maestro:maestro@localhost:5432/maestro -f packages/db/init/01-roles.sql
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Recall evals (offline, deterministic)
        run: pnpm evals
